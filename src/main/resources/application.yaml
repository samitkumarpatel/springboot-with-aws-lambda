spring:
  application:
    name: springboot-with-aws-lambda
  security:
    user:
      name: user
      password: password
      roles: USER
  cloud:
    aws:
      credentials:
        secret-key: ${AWS_SECRET_KEY}
        access-key: ${AWS_ACCESS_KEY}
      region:
        static: eu-north-1
  main:
    lazy-initialization: true

logging:
  level:
    org.springframework.security: TRACE
    web: debug